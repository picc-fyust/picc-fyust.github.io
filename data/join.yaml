# 加入我们。名额数字请以当年招生简章为准，这里不写具体数字。
lead_zh: 中心三位教师联合指导，长期招收博士生、硕士生、科研实习生与访问学生，三个研究方向都欢迎申请。
lead_en: >-
  The three faculty members co-supervise students. We are always looking for PhD students, master's students,
  research interns and visiting students, across all three research directions.

# 突出的色块，单独一块放在最上面
compute_title_zh: 算力与硬件支撑
compute_title_en: Compute and Hardware Support
compute_zh: >-
  中心能为科研与项目提供充裕的算力支撑，包含百卡 GPU 集群（单卡显存 ≥ 80G、单机显存和内存高达近 1.5T）等，
  并为机器人、边缘设备与可穿戴系统等方向配备相应的实验硬件。
  我们鼓励学生在三个方向之外拓展新的研究方向：只要方向站得住，所需的算力与硬件设备由中心解决，
  不让设备条件成为选题的限制。
compute_en: >-
  The centre provides ample compute for research and projects, including a GPU cluster of over one hundred cards
  (at least 80 GB of memory per card, and up to nearly 1.5 TB of GPU memory plus RAM per node), together with the
  experimental hardware needed for robotics, edge devices and wearable systems. We encourage students to open new
  research directions beyond the three lines: if the direction holds up, the centre supplies the compute and
  hardware it needs, so that equipment is never the constraint on what you can work on.

# 色块下面的四张卡片
offers:
  - title_zh: 三位导师方向互补
    title_en: Complementary supervision
    text_zh: 机器人进化、边缘智能、穿戴系统三条线彼此相邻，可以在交界处选题，由两位老师联合指导。
    text_en: The three lines sit next to one another; topics at their boundaries are co-supervised by two faculty members.
  - title_zh: 国家级项目在研
    title_en: Funded projects
    text_zh: 国家自然科学基金面上、青年等项目在研，课题来自真实需求。
    text_en: Ongoing NSFC general and young-scientist projects; topics come from real needs.
  - title_zh: 顶刊顶会训练
    title_en: Top-venue training
    text_zh: 从选题、实验到 IEEE 汇刊与顶会写作、评审，全流程带着做。
    text_en: End-to-end training through to IEEE transactions and top-conference writing and reviewing.
  - title_zh: 按贡献署名
    title_en: Authorship by contribution
    text_zh: 论文署名以实际贡献为准，学生一作是常态。
    text_en: Authorship follows actual contribution; student first-authorship is the norm.

sections:
  - id: phd
    title_zh: 博士生
    title_en: PhD students
    body_zh:
      - 招收计算机、控制、电子信息、人工智能及相关专业的申请者，名额以学校当年研究生招生简章为准。
      - 机器人进化方向需要较强的算法与仿真能力；边缘智能方向需要机器学习或通信基础；穿戴系统方向需要嵌入式或系统开发能力。有论文、竞赛或开源项目经历者优先。
      - 申请材料：简历、成绩单、代表性论文或项目、一页研究设想。邮件主题请写“博士申请-姓名-院校-意向方向”。
    body_en:
      - Applicants from computer science, control, electronic information, AI and related fields. Quotas follow the university's annual admission guide.
      - The robotics line expects strong algorithm and simulation skills; the edge line expects a machine learning or communications background; the wearable line expects embedded or systems development skills. Publications, competitions or open-source work are a plus.
      - "Materials: CV, transcript, representative papers or projects, and a one-page research statement. Email subject: PhD application - name - university - intended line."
  - id: master
    title_zh: 硕士生
    title_en: Master's students
    body_zh:
      - 招收学术型与专业型硕士，名额以学校当年研究生招生简章为准。
      - 要求良好的编程与数学基础，对三个方向之一有明确兴趣。
      - 申请材料：简历、成绩单、项目或竞赛经历。邮件主题请写“硕士申请-姓名-院校-意向方向”。
    body_en:
      - Academic and professional master's students. Quotas follow the university's annual admission guide.
      - Good programming and mathematics foundations and a clear interest in one of the three lines.
      - "Materials: CV, transcript, project or competition experience. Email subject: Master application - name - university - intended line."
  - id: intern
    title_zh: 科研实习生
    title_en: Research interns
    body_zh:
      - 欢迎校内外本科生参与科研训练，建议持续 6 个月以上，可远程。
      - 参与真实课题，按贡献署名；表现优秀者优先推荐攻读研究生。
      - 申请材料：简历、成绩单、可用时间。邮件主题请写“实习申请-姓名-院校-年级”。
    body_en:
      - Undergraduates from any university are welcome; we suggest a commitment of six months or longer, remote is possible.
      - Work on real projects with authorship by contribution; strong interns are recommended for graduate admission.
      - "Materials: CV, transcript, availability. Email subject: Internship application - name - university - year."
  - id: visiting
    title_zh: 访问学生与合作
    title_en: Visiting students and collaboration
    body_zh:
      - 欢迎联合培养、访问研究和企业合作，请直接邮件联系对应方向的教师。
    body_en:
      - Joint training, visiting research and industry collaboration are welcome. Please email the faculty member of the relevant line.

contact_zh: 申请请发邮件至对应方向的教师，或发至中心联系邮箱。
contact_en: Send applications to the faculty member of the relevant line, or to the centre contact email.
