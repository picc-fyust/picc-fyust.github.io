- id: shi
  tier: faculty
  name_zh: 师少龙
  name_en: Shaolong Shi
  title_zh: 副教授
  title_en: Associate Professor
  direction: evo-robot
  email: shishaolong@fyust.edu.cn
  homepage: https://cs.fyust.edu.cn/szdw/jsdw/ssl.htm
  links: []
  photo: shi.jpg
  bio_zh: >-
    福耀科技大学计算与人工智能学院副教授，香江学者。本、硕、博毕业于哈尔滨工业大学控制及计算机学科，
    先后任职于鹏城国家实验室、电子科技大学、香港城市大学等。发表国际期刊及会议论文 40 余篇，
    其中以第一作者发表多篇 IEEE 汇刊及封面、亮点和热点论文；申请及授权国家发明专利 10 余项，
    主持及参与国家、省、市级科研项目 10 余项。
  bio_en: >-
    Associate Professor at the School of Computing and AI, FYUST, and a Hong Kong Scholar. He received his
    bachelor's, master's and doctoral degrees in control and computer science from Harbin Institute of Technology,
    and previously worked at Pengcheng Laboratory, UESTC and City University of Hong Kong. He has published 40+
    journal and conference papers, including several IEEE transactions papers as first author with cover, spotlight
    and hot-paper selections, holds 10+ national patents, and has led or participated in 10+ funded projects.

- id: han
  tier: faculty
  name_zh: 韩俏梅
  name_en: Qiaomei Han
  title_zh: 助理教授
  title_en: Assistant Professor
  direction: edge-perception
  email: qiaomhan@fyust.edu.cn
  homepage: https://cs.fyust.edu.cn/szdw/jsdw/hqm.htm
  links: []
  photo: han.jpg
  bio_zh: >-
    福耀科技大学计算与人工智能学院助理教授，博士毕业于加拿大西安大略大学，此前于大连理工大学获得学士和硕士学位。
    主要研究方向包括边缘智能与分布式机器学习、AI原生无线网络、多模态智能计算以及通信感知计算一体化，以及在
    智能交通和工业自动化等场景中的应用。研究成果发表于 IEEE TMC、IEEE TCCN、INFOCOM、ICC 等国际期刊和会议。

  bio_en: >-
    Assistant Professor at the School of Computing and AI, FYUST. She received her PhD in Electrical and Computer Engineering 
    from Western University, Canada, after earning her bachelor's and master's degrees from Dalian University of Technology. 
    Her research interests include edge intelligence and distributed machine learning, AI-native wireless networks, multimodal 
    intelligent computing, and integrated sensing, communication, and computing, with applications to intelligent 
    transportation and industrial automation. Her work has been published in IEEE TMC, IEEE TCCN, INFOCOM, ICC, and other 
    international journals and conferences.

- id: wang
  tier: faculty
  name_zh: 王春棉
  name_en: Chunmian Wang
  title_zh: 助理教授
  title_en: Assistant Professor
  direction: wearable
  email: chunmianwang@fyust.edu.cn
  homepage: https://cs.fyust.edu.cn/szdw/jsdw/wcm.htm
  links: []
  photo: wang.jpg
  bio_zh: >-
    福耀科技大学计算与人工智能学院助理教授，博士毕业于东南大学计算机科学与工程学院。
    长期从事网络协议分析、流量分析与隐私保护研究，发现的安全漏洞收录 CVE 并获 Bug Bounty 奖励，
    在 IEEE S&P、INFOCOM、WWW、TNSE 等发表论文 8 篇，参与 10 余项面向国防与公共安全部门的科研任务。
    现在中心开展智能穿戴系统与数据隐私方向的研究。
  bio_en: >-
    Assistant Professor at the School of Computing and AI, FYUST, with a PhD from the School of Computer Science
    and Engineering, Southeast University. His work covers network protocol analysis, traffic analysis and privacy
    protection; vulnerabilities he found have been assigned CVE IDs and received a bug bounty. He has published 8
    papers in venues including IEEE S&P, INFOCOM, WWW and TNSE. At the centre he is opening a new line on wearable
    systems and data privacy.

